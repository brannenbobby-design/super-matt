<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Super Matt</title>
<style>
  * { box-sizing:border-box; }
  html, body {
    margin:0; width:100%; height:100%; overflow:hidden;
    background:#05070d; font-family:monospace; touch-action:none;
  }
  #stage {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#05070d;
  }
  canvas {
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    background:#66cfff;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    display:block;
  }
  #controls {
    position:fixed; left:0; right:0; bottom:12px; z-index:10;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:0 14px; pointer-events:none;
  }
  .group { display:flex; gap:10px; }
  button {
    pointer-events:auto; width:68px; height:68px;
    border-radius:18px; border:3px solid rgba(255,255,255,.7);
    background:rgba(16,24,39,.85); color:#fff;
    font:bold 28px monospace; box-shadow:0 4px 0 rgba(0,0,0,.45);
  }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.45); }
  #jump {
    width:86px; height:86px; border-radius:50%;
    background:rgba(176,26,61,.95); font-size:18px;
  }
  #restart { width:92px; height:50px; font-size:11px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="group">
    <button id="restart">RESTART</button>
    <button id="jump">JUMP</button>
  </div>
</div>
<script src="game1.js"></script>
<script src="game2.js"></script>
<script src="game3.js"></script>
</body>
</html>
